blueprint:
  name: My Rail Commute - Status change alert
  description: >-
    Get notified when your commute status worsens (Minor Delays, Major Delays,
    Severe Disruption or Critical), and optionally when it returns to Normal.


    Pick the **Status** sensor of your commute (for example
    `sensor.morning_commute_status`). For a multi-leg journey, pick the
    whole-journey status sensor rather than a `leg` sensor.


    To get phone notifications, pick your phone in **Phone to notify**. The
    title and message are filled in for you. Until then it shows a Home
    Assistant notification.
  domain: automation
  author: adamf83
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/adamf83/my-rail-commute/blob/main/blueprints/automation/my_rail_commute/commute_status_change.yaml
  input:
    status_sensor:
      name: Commute status sensor
      description: The "Status" sensor created by My Rail Commute.
      selector:
        entity:
          filter:
            - integration: my_rail_commute
              domain: sensor
    alert_statuses:
      name: Statuses to alert on
      description: Notify when the status changes to any of these.
      default:
        - Minor Delays
        - Major Delays
        - Severe Disruption
        - Critical
      selector:
        select:
          multiple: true
          options:
            - Minor Delays
            - Major Delays
            - Severe Disruption
            - Critical
    notify_recovery:
      name: Notify when back to Normal
      description: Also notify when the status returns to Normal after an alert.
      default: false
      selector:
        boolean:
    active_days:
      name: Days of the week
      description: Only notify on these days.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    notify_device:
      name: Phone to notify
      description: >-
        Pick the phone running the Home Assistant app. The title and message
        are filled in for you. Leave empty to show a Home Assistant
        notification instead.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app
    notify_service:
      name: Other notify service (optional)
      description: >-
        Advanced. To use something other than the app, for example
        `notify.telegram`, enter the notify service here. Can be used as well
        as the phone.
      default: ""
      selector:
        text:
    notify_action:
      name: Additional actions (optional)
      description: >-
        Advanced. Extra actions to run when an alert is sent, for example a
        speaker announcement. The variables `title` and `message` are available
        to your templates.
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

variables:
  notify_device: !input notify_device
  notify_service: !input notify_service
  status_sensor: !input status_sensor
  alert_statuses: !input alert_statuses
  notify_recovery: !input notify_recovery

triggers:
  - trigger: state
    entity_id: !input status_sensor
    to: !input alert_statuses
    id: alert
  - trigger: state
    entity_id: !input status_sensor
    to: Normal
    id: recovered

conditions:
  - condition: time
    weekday: !input active_days
  - condition: template
    value_template: >-
      {% set previous = trigger.from_state.state if trigger.from_state else 'unavailable' %}
      {{ previous not in ['unavailable', 'unknown']
         and (trigger.id == 'alert'
              or (notify_recovery and previous in alert_statuses)) }}

actions:
  - variables:
      status: "{{ trigger.to_state.state }}"
      max_delay: "{{ state_attr(status_sensor, 'max_delay_minutes') | int(0) }}"
      cancelled: "{{ state_attr(status_sensor, 'cancelled_count') | int(0) }}"
      delayed: >-
        {{ (state_attr(status_sensor, 'minor_delays_count') | int(0))
           + (state_attr(status_sensor, 'major_delays_count') | int(0)) }}
      commute: >-
        {{ device_attr(status_sensor, 'name_by_user') or device_attr(status_sensor, 'name') or 'Your commute' }}
      route: >-
        {% set o = state_attr(status_sensor, 'origin_name') %}
        {% set d = state_attr(status_sensor, 'destination_name') %}
        {% if o and d %}{{ o }} to {{ d }}{% endif %}
      total: "{{ state_attr(status_sensor, 'total_trains') | int(0) }}"
      on_time: "{{ state_attr(status_sensor, 'on_time_count') | int(0) }}"
      title: >-
        {% if trigger.id == 'recovered' %}{{ commute }} back to normal{% else %}{{ commute }} status: {{ status }}{% endif %}
      message: >-
        {% if trigger.id == 'recovered' %}
        {% if total | int > 0 %}All {{ total }} trains are running normally again.{% else %}Services are running normally again.{% endif %}
        {% else %}
        {% set parts = [] %}
        {% if cancelled | int > 0 %}{% set parts = parts + [cancelled ~ ' cancelled'] %}{% endif %}
        {% if delayed | int > 0 %}{% set parts = parts + [delayed ~ ' delayed'] %}{% endif %}
        {% if max_delay | int > 0 %}{% set parts = parts + ['worst delay ' ~ max_delay ~ ' min'] %}{% endif %}
        {% if total | int > 0 %}{% set parts = parts + [on_time ~ ' of ' ~ total ~ ' trains on time'] %}{% endif %}
        {% if route and route != commute %}{{ route }}: {% endif %}{{ (parts | join(', ') | capitalize ~ '.') if parts else 'Status is now ' ~ status ~ '.' }}
        {% endif %}
  - alias: Notify the phone
    if: "{{ notify_device != '' }}"
    then:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Send to the notify service
    if: "{{ notify_service | trim != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Show a Home Assistant notification
    if: "{{ notify_device == '' and notify_service | trim == '' }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Run additional actions
    sequence: !input notify_action
