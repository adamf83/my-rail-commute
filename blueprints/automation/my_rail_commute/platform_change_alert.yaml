blueprint:
  name: My Rail Commute - Platform change alert
  description: >-
    Get notified when the platform of an upcoming train changes, so you can
    move before the rush. Platforms that are announced for the first time
    (previously blank or "TBA") are not treated as a change unless you ask
    for them.


    Pick one or more **Next Train** / **Train N** sensors of your commute. The
    Next Train sensor covers your very next train; add Train 2, Train 3 and so
    on if you also want to hear about later services.


    To get phone notifications, set **Notification service** to your notify
    service (for example `notify.mobile_app_your_phone`). The title and message
    are filled in for you. Until then it shows a Home Assistant notification.
  domain: automation
  author: adamf83
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/adamf83/my-rail-commute/blob/main/blueprints/automation/my_rail_commute/platform_change_alert.yaml
  input:
    train_sensors:
      name: Train sensors
      description: The "Next Train" and/or "Train N" sensors to watch.
      selector:
        entity:
          multiple: true
          filter:
            - integration: my_rail_commute
              domain: sensor
    include_first_announcement:
      name: Also notify when a platform is first announced
      description: >-
        Send an alert when a train goes from no platform (or "TBA") to a
        platform, not just when an announced platform changes.
      default: false
      selector:
        boolean:
    active_days:
      name: Days of the week
      description: Only notify on these days.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    notify_service:
      name: Notification service
      description: >-
        The notify service to send to, for example
        `notify.mobile_app_your_phone`. Leave as is to show a Home Assistant
        notification instead. Clear it to send nothing.
      default: persistent_notification.create
      selector:
        text:
    notify_action:
      name: Additional actions (optional)
      description: >-
        Advanced. Extra actions to run when an alert is sent, for example a
        speaker announcement. The variables `title` and `message` are available
        to your templates.
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

variables:
  notify_service: !input notify_service
  include_first_announcement: !input include_first_announcement

triggers:
  - trigger: state
    entity_id: !input train_sensors
    attribute: platform

conditions:
  - condition: time
    weekday: !input active_days
  - condition: template
    value_template: >-
      {% set attrs = trigger.to_state.attributes if trigger.to_state else {} %}
      {{ attrs.get('platform_changed', false) is true
         and (include_first_announcement
              or (attrs.get('previous_platform') or '') not in ['', 'TBA']) }}

actions:
  - variables:
      attrs: "{{ trigger.to_state.attributes }}"
      departure: "{{ attrs.get('departure_time') }}"
      platform: "{{ attrs.get('platform') or 'TBA' }}"
      previous: "{{ attrs.get('previous_platform') or '' }}"
      commute: >-
        {{ device_attr(trigger.entity_id, 'name_by_user') or device_attr(trigger.entity_id, 'name') or 'Your commute' }}
      title: "{{ commute }}: platform change"
      message: >-
        The {{ departure }} train
        {% if previous not in ['', 'TBA'] %}has moved from platform {{ previous }} to platform {{ platform }}.
        {% else %}will now leave from platform {{ platform }}.{% endif %}
  - alias: Send the notification
    if: "{{ notify_service | trim != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Run additional actions
    sequence: !input notify_action
