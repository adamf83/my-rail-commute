blueprint:
  name: My Rail Commute - Delay Repay claims reminder
  description: >-
    Get a regular reminder when you have unclaimed Delay Repay journeys,
    including how many and the deadline of the oldest one, so claims are not
    missed.


    Requires Delay Repay tracking to be enabled for the commute (Configure >
    Track Delay Repay claims). Pick the **Delay Repay Claims** sensor (for
    example `sensor.morning_commute_delay_repay_claims`). After claiming, mark
    journeys as claimed with the `my_rail_commute.mark_delay_repay_claimed`
    action so they stop being counted.


    To get phone notifications, pick your phone in **Phone to notify**. The
    title and message are filled in for you. Until then it shows a Home
    Assistant notification.
  domain: automation
  author: adamf83
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/adamf83/my-rail-commute/blob/main/blueprints/automation/my_rail_commute/delay_repay_reminder.yaml
  input:
    claims_sensor:
      name: Delay Repay claims sensor
      description: The "Delay Repay Claims" sensor created by My Rail Commute.
      selector:
        entity:
          filter:
            - integration: my_rail_commute
              domain: sensor
    reminder_time:
      name: Reminder time
      default: "18:00:00"
      selector:
        time:
    reminder_days:
      name: Days of the week
      description: Send the reminder on these days.
      default: [sun]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    min_claims:
      name: Minimum unclaimed journeys
      description: Only remind when at least this many journeys are unclaimed.
      default: 1
      selector:
        number:
          min: 1
          max: 100
          mode: box
    notify_device:
      name: Phone to notify
      description: >-
        Pick the phone running the Home Assistant app. The title and message
        are filled in for you. Leave empty to show a Home Assistant
        notification instead.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app
    notify_service:
      name: Other notify service (optional)
      description: >-
        Advanced. To use something other than the app, for example
        `notify.telegram`, enter the notify service here. Can be used as well
        as the phone.
      default: ""
      selector:
        text:
    notify_action:
      name: Additional actions (optional)
      description: >-
        Advanced. Extra actions to run when an alert is sent, for example a
        speaker announcement. The variables `title` and `message` are available
        to your templates.
      default: []
      selector:
        action:

mode: single
max_exceeded: silent

variables:
  notify_device: !input notify_device
  notify_service: !input notify_service
  claims_sensor: !input claims_sensor
  min_claims: !input min_claims

triggers:
  - trigger: time
    at: !input reminder_time

conditions:
  - condition: time
    weekday: !input reminder_days
  - condition: template
    value_template: >-
      {{ states(claims_sensor) | int(0) >= (min_claims | int(1)) }}

actions:
  - variables:
      count: "{{ states(claims_sensor) | int(0) }}"
      oldest: "{{ state_attr(claims_sensor, 'oldest_unclaimed_date') }}"
      deadline: "{{ state_attr(claims_sensor, 'oldest_claim_deadline') }}"
      commute: >-
        {{ device_attr(claims_sensor, 'name_by_user') or device_attr(claims_sensor, 'name') or 'Your commute' }}
      title: >-
        {{ commute }}: {{ count }} unclaimed Delay Repay {{ 'journey' if count | int == 1 else 'journeys' }}
      message: >-
        You have not yet claimed for {{ 'it' if count | int == 1 else 'them' }}.
        {% if oldest %}The oldest is from {{ oldest }}.{% endif %}
        {% if deadline %}Claim it by {{ deadline }}.{% endif %}
  - alias: Notify the phone
    if: "{{ notify_device != '' }}"
    then:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Send to the notify service
    if: "{{ notify_service | trim != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Show a Home Assistant notification
    if: "{{ notify_device == '' and notify_service | trim == '' }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Run additional actions
    sequence: !input notify_action
