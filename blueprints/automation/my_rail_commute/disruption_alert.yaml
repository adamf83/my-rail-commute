blueprint:
  name: My Rail Commute - Disruption alert
  description: >-
    Get notified, with the reasons, when disruption is detected on your commute
    (any status other than Normal), and optionally when services are back to
    normal.


    Pick the **Has Disruption** binary sensor of your commute (for example
    `binary_sensor.morning_commute_has_disruption`).


    To get phone notifications, pick your phone in **Phone to notify**. The
    title and message are filled in for you. Until then it shows a Home
    Assistant notification.
  domain: automation
  author: adamf83
  homeassistant:
    min_version: 2024.10.0
  source_url: https://github.com/adamf83/my-rail-commute/blob/main/blueprints/automation/my_rail_commute/disruption_alert.yaml
  input:
    disruption_sensor:
      name: Has disruption sensor
      description: The "Has Disruption" binary sensor created by My Rail Commute.
      selector:
        entity:
          filter:
            - integration: my_rail_commute
              domain: binary_sensor
    notify_clear:
      name: Notify when disruption clears
      description: Also notify when the commute returns to normal.
      default: false
      selector:
        boolean:
    active_days:
      name: Days of the week
      description: Only notify on these days.
      default: [mon, tue, wed, thu, fri, sat, sun]
      selector:
        select:
          multiple: true
          options:
            - mon
            - tue
            - wed
            - thu
            - fri
            - sat
            - sun
    notify_device:
      name: Phone to notify
      description: >-
        Pick the phone running the Home Assistant app. The title and message
        are filled in for you. Leave empty to show a Home Assistant
        notification instead.
      default: ""
      selector:
        device:
          filter:
            - integration: mobile_app
    notify_service:
      name: Other notify service (optional)
      description: >-
        Advanced. To use something other than the app, for example
        `notify.telegram`, enter the notify service here. Can be used as well
        as the phone.
      default: ""
      selector:
        text:
    notify_action:
      name: Additional actions (optional)
      description: >-
        Advanced. Extra actions to run when an alert is sent, for example a
        speaker announcement. The variables `title` and `message` are available
        to your templates.
      default: []
      selector:
        action:

mode: queued
max_exceeded: silent

variables:
  notify_device: !input notify_device
  notify_service: !input notify_service
  disruption_sensor: !input disruption_sensor
  notify_clear: !input notify_clear

triggers:
  - trigger: state
    entity_id: !input disruption_sensor
    from: "off"
    to: "on"
    id: disruption
  - trigger: state
    entity_id: !input disruption_sensor
    from: "on"
    to: "off"
    id: clear

conditions:
  - condition: time
    weekday: !input active_days
  - condition: template
    value_template: "{{ trigger.id == 'disruption' or notify_clear }}"

actions:
  - variables:
      status: "{{ state_attr(disruption_sensor, 'current_status') or 'Disruption' }}"
      max_delay: "{{ state_attr(disruption_sensor, 'max_delay_minutes') | int(0) }}"
      cancelled: "{{ state_attr(disruption_sensor, 'cancelled_count') | int(0) }}"
      reasons: "{{ state_attr(disruption_sensor, 'disruption_reasons') or [] }}"
      commute: >-
        {{ device_attr(disruption_sensor, 'name_by_user') or device_attr(disruption_sensor, 'name') or 'Your commute' }}
      title: >-
        {% if trigger.id == 'clear' %}{{ commute }} back to normal{% else %}{{ commute }} disruption: {{ status }}{% endif %}
      message: >-
        {% if trigger.id == 'clear' %}
        Services are running normally again.
        {% else %}
        {% set parts = [] %}
        {% if reasons | length > 0 %}{% set parts = parts + [reasons | join('. ') ~ '.'] %}{% endif %}
        {% if cancelled | int > 0 %}{% set parts = parts + [cancelled ~ ' cancelled.'] %}{% endif %}
        {% if max_delay | int > 0 %}{% set parts = parts + ['Worst delay: ' ~ max_delay ~ ' min.'] %}{% endif %}
        {{ parts | join(' ') if parts else 'Check your commute for details.' }}
        {% endif %}
  - alias: Notify the phone
    if: "{{ notify_device != '' }}"
    then:
      - action: "notify.mobile_app_{{ device_attr(notify_device, 'name') | slugify }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Send to the notify service
    if: "{{ notify_service | trim != '' }}"
    then:
      - action: "{{ notify_service }}"
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Show a Home Assistant notification
    if: "{{ notify_device == '' and notify_service | trim == '' }}"
    then:
      - action: persistent_notification.create
        data:
          title: "{{ title }}"
          message: "{{ message }}"
  - alias: Run additional actions
    sequence: !input notify_action
