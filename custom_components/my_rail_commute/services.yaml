add_favourite:
  name: Add Favourite
  description: Save a departure time as a favourite so it persists even after the train departs.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time to save, e.g. "08:15".
      required: true
      selector:
        text: {}
    operator:
      name: Operator
      description: Optional train operator name, e.g. "GWR".
      required: false
      selector:
        text: {}

remove_favourite:
  name: Remove Favourite
  description: Remove a previously saved favourite departure time.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time to remove, e.g. "08:15".
      required: true
      selector:
        text: {}

flag_train:
  name: Flag Train
  description: Flag a specific train service for later review. Persists after departure.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    service_id:
      name: Service ID
      description: The unique service ID from the API (service_id attribute on the train sensor).
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time of the service, e.g. "08:30".
      required: true
      selector:
        text: {}
    operator:
      name: Operator
      description: Optional train operator name.
      required: false
      selector:
        text: {}
    reason:
      name: Reason
      description: Optional reason for flagging, e.g. "delay" or "overcrowded".
      required: false
      selector:
        text: {}

unflag_train:
  name: Unflag Train
  description: Remove a flagged train from the flagged list.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    service_id:
      name: Service ID
      description: The unique service ID of the train to unflag.
      required: true
      selector:
        text: {}

clear_favourites:
  name: Clear Favourites
  description: Remove all saved favourites for this commute.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}

clear_flagged:
  name: Clear Flagged Trains
  description: Remove all flagged trains for this commute.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}

get_historical_raw_data:
  name: Get Historical Raw Data
  description: Retrieve the full raw historical daily statistics for a commute. Returns up to 90 days of per-day on-time and delay data.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}

mark_delay_repay_claimed:
  name: Mark Delay Repay Claimed
  description: Mark journeys as claimed so they stop appearing as outstanding. Select journeys by key, by a date range (by departure date), or both.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    journeys:
      name: Journeys
      description: Journey keys to mark, as listed in the Delay Repay Claims sensor's claims attribute (the "key" field).
      required: false
      selector:
        object: {}
    from_date:
      name: From date
      description: Mark every journey departing on or after this date.
      required: false
      selector:
        date: {}
    to_date:
      name: To date
      description: Mark every journey departing on or before this date.
      required: false
      selector:
        date: {}

dismiss_delay_repay:
  name: Dismiss Delay Repay Journeys
  description: Dismiss journeys you do not intend to claim for. Select journeys by key, by a date range (by departure date), or both.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    journeys:
      name: Journeys
      description: Journey keys to dismiss, as listed in the Delay Repay Claims sensor's claims attribute (the "key" field).
      required: false
      selector:
        object: {}
    from_date:
      name: From date
      description: Dismiss every journey departing on or after this date.
      required: false
      selector:
        date: {}
    to_date:
      name: To date
      description: Dismiss every journey departing on or before this date.
      required: false
      selector:
        date: {}

get_delay_repay_claims:
  name: Get Delay Repay Claims
  description: Return every outstanding Delay Repay journey for a commute, newest first. The sensor attribute shows only the most recent few.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    include_handled:
      name: Include handled
      description: Also include claimed, dismissed, pending and expired journeys.
      required: false
      default: false
      selector:
        boolean: {}
    journeys:
      name: Journeys
      description: Return only these journeys (by key, any status), each with its service details such as platform and calling points.
      required: false
      selector:
        object: {}

get_departure_board:
  name: Get Departure Board
  description: Debugging tool. Return the raw Rail Data Marketplace departure board response (GetDepBoardWithDetails) for a station, using the API key already configured. The result is the status and JSON body exactly as the API sent them. Fields left blank are not sent, so the API's own default applies.
  fields:
    entry_id:
      name: Commute
      description: The commute whose departure board API key to use. Optional when only one commute is set up.
      required: false
      selector:
        config_entry:
          integration: my_rail_commute
    crs:
      name: Station
      description: The 3-letter CRS code of the station the board is for, e.g. "PAD".
      required: true
      example: PAD
      selector:
        text: {}
    filter_crs:
      name: Destination filter
      description: Only show services calling at this station (3-letter CRS code).
      required: false
      example: RDG
      selector:
        text: {}
    time_window:
      name: Time window
      description: Minutes after now that the board covers.
      required: false
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    num_rows:
      name: Number of rows
      description: Maximum number of services to return.
      required: false
      selector:
        number:
          min: 0
          max: 150
          mode: box

get_arrival_board:
  name: Get Arrival Board
  description: Debugging tool. Return the raw Rail Data Marketplace arrival board response (GetArrBoardWithDetails) for a station, using the API key already configured. This needs the Live Arrival Board key. The result is the status and JSON body exactly as the API sent them. Fields left blank are not sent, so the API's own default applies.
  fields:
    entry_id:
      name: Commute
      description: The commute whose API keys to use. Optional when only one commute is set up. The arrival board key may come from another commute.
      required: false
      selector:
        config_entry:
          integration: my_rail_commute
    crs:
      name: Station
      description: The 3-letter CRS code of the station the board is for (e.g. your journey's destination), e.g. "RDG".
      required: true
      example: RDG
      selector:
        text: {}
    filter_crs:
      name: Origin filter
      description: Only show services that started at this station (3-letter CRS code).
      required: false
      example: PAD
      selector:
        text: {}
    time_offset:
      name: Time offset
      description: Minutes relative to now at which the board starts. Negative values look back.
      required: false
      selector:
        number:
          min: -120
          max: 120
          unit_of_measurement: min
          mode: box
    time_window:
      name: Time window
      description: Minutes the board covers from the offset.
      required: false
      selector:
        number:
          min: 0
          max: 120
          unit_of_measurement: min
          mode: box
    num_rows:
      name: Number of rows
      description: Maximum number of services to return.
      required: false
      selector:
        number:
          min: 0
          max: 150
          mode: box

get_service_details:
  name: Get Service Details
  description: Debugging tool. Return the raw Rail Data Marketplace service details response (GetServiceDetails) for a service ID, using the API key already configured. This needs the Service Details key. A service ID only works while the service is on the board that issued it, so use one from a board response straight away. The result is the status and JSON body exactly as the API sent them.
  fields:
    entry_id:
      name: Commute
      description: The commute whose API keys to use. Optional when only one commute is set up. The service details key may come from another commute.
      required: false
      selector:
        config_entry:
          integration: my_rail_commute
    service_id:
      name: Service ID
      description: The service ID from a board response (the serviceIdUrlSafe or serviceID field).
      required: true
      selector:
        text: {}
