add_favourite:
  name: Add Favourite
  description: Save a departure time as a favourite so it persists even after the train departs.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time to save, e.g. "08:15".
      required: true
      selector:
        text: {}
    operator:
      name: Operator
      description: Optional train operator name, e.g. "GWR".
      required: false
      selector:
        text: {}

remove_favourite:
  name: Remove Favourite
  description: Remove a previously saved favourite departure time.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time to remove, e.g. "08:15".
      required: true
      selector:
        text: {}

flag_train:
  name: Flag Train
  description: Flag a specific train service for later review. Persists after departure.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    service_id:
      name: Service ID
      description: The unique service ID from the API (service_id attribute on the train sensor).
      required: true
      selector:
        text: {}
    scheduled_departure:
      name: Scheduled Departure
      description: The scheduled departure time of the service, e.g. "08:30".
      required: true
      selector:
        text: {}
    operator:
      name: Operator
      description: Optional train operator name.
      required: false
      selector:
        text: {}
    reason:
      name: Reason
      description: Optional reason for flagging, e.g. "delay" or "overcrowded".
      required: false
      selector:
        text: {}

unflag_train:
  name: Unflag Train
  description: Remove a flagged train from the flagged list.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}
    service_id:
      name: Service ID
      description: The unique service ID of the train to unflag.
      required: true
      selector:
        text: {}

clear_favourites:
  name: Clear Favourites
  description: Remove all saved favourites for this commute.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}

clear_flagged:
  name: Clear Flagged Trains
  description: Remove all flagged trains for this commute.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute.
      required: true
      selector:
        text: {}

get_historical_raw_data:
  name: Get Historical Raw Data
  description: Retrieve the full raw historical daily statistics for a commute. Returns up to 90 days of per-day on-time and delay data.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}

mark_delay_repay_claimed:
  name: Mark Delay Repay Claimed
  description: Mark journeys as claimed so they stop appearing as outstanding. Select journeys by key, by a date range (by departure date), or both.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    journeys:
      name: Journeys
      description: Journey keys to mark, as listed in the Delay Repay Claims sensor's claims attribute (the "key" field).
      required: false
      selector:
        object: {}
    from_date:
      name: From date
      description: Mark every journey departing on or after this date.
      required: false
      selector:
        date: {}
    to_date:
      name: To date
      description: Mark every journey departing on or before this date.
      required: false
      selector:
        date: {}

dismiss_delay_repay:
  name: Dismiss Delay Repay Journeys
  description: Dismiss journeys you do not intend to claim for. Select journeys by key, by a date range (by departure date), or both.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    journeys:
      name: Journeys
      description: Journey keys to dismiss, as listed in the Delay Repay Claims sensor's claims attribute (the "key" field).
      required: false
      selector:
        object: {}
    from_date:
      name: From date
      description: Dismiss every journey departing on or after this date.
      required: false
      selector:
        date: {}
    to_date:
      name: To date
      description: Dismiss every journey departing on or before this date.
      required: false
      selector:
        date: {}

get_delay_repay_claims:
  name: Get Delay Repay Claims
  description: Return every outstanding Delay Repay journey for a commute, newest first. The sensor attribute shows only the most recent few.
  fields:
    entry_id:
      name: Entry ID
      description: The config entry ID of the commute (find it in Settings → Integrations).
      required: true
      selector:
        text: {}
    include_handled:
      name: Include handled
      description: Also include claimed, dismissed, pending and expired journeys.
      required: false
      default: false
      selector:
        boolean: {}
    journeys:
      name: Journeys
      description: Return only these journeys (by key, any status), each with its service details such as platform and calling points.
      required: false
      selector:
        object: {}
